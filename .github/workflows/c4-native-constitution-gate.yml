name: C4 Native Constitution and Cognitive Regression Gate
on:
  push:
    branches:
      - experiments/c4-g331-native-cognition
  workflow_dispatch:
jobs:
  native-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install native import dependencies
        run: python -m pip install pytest numpy
      - name: Verify pinned original C4 native runtime archive
        shell: bash
        run: |
          set -euo pipefail
          echo '7bd314029d4b927eb00e847ec52d2d3d45ffba06b7f30bba094a06af6be47f76  experimental_g331/assets/C4_G331_C004_NATIVE_RUNTIME.zip' | sha256sum -c -
          mkdir -p /tmp/c4-native
          unzip -q experimental_g331/assets/C4_G331_C004_NATIVE_RUNTIME.zip -d /tmp/c4-native
          test -s /tmp/c4-native/c4child/runtime.py
          test -s /tmp/c4-native/c4child/structured_cognition.py
          # The pinned ZIP is the 56-module native baseline; C004-R3 only overlays
          # the tested existing cognition module. Never introduce a second brain.
          echo 'b388140e6311b3cf2d4b2315596801fea34f536fd37330226b381cd5b71a58a5  experimental_g331/native_c4child/structured_cognition.py' | sha256sum -c -
          cp experimental_g331/native_c4child/structured_cognition.py /tmp/c4-native/c4child/structured_cognition.py
          echo '209977573522203d587f5a18d448bf9f1aceb9c4368d6df884b4235b2167104b  experimental_g331/native_c4child/runtime.py' | sha256sum -c -
          cp experimental_g331/native_c4child/runtime.py /tmp/c4-native/c4child/runtime.py
          cmp experimental_g331/native_c4child/structured_cognition.py /tmp/c4-native/c4child/structured_cognition.py
          cmp experimental_g331/native_c4child/runtime.py /tmp/c4-native/c4child/runtime.py
      - name: Run frozen native cognition plus constitutional gates
        env:
          PYTHONPATH: /tmp/c4-native:experimental_g331
        run: |
          python -m pytest -q \
            experimental_g331/tests/test_g331_real_organism.py \
            experimental_g331/tests/test_c001_temporal_dialogue.py \
            experimental_g331/tests/test_c002_nested_time.py \
            experimental_g331/tests/test_c002_foundational_gate.py \
            experimental_g331/tests/test_c002_training_gate.py \
            experimental_g331/tests/test_c003_causal_credit.py \
            experimental_g331/tests/test_c004_native_host.py \
            experimental_g331/tests/test_c004_room_target.py \
            experimental_g331/tests/test_c004_r3_outcome_distinction.py
      - name: Check constitution and block unsafe autonomous pretraining
        shell: bash
        env:
          PYTHONPATH: experimental_g331
        run: |
          set -euo pipefail
          python experimental_g331/tools/c4_stage_gate.py --request constitution_only --contract experimental_g331/governance/constitution_contract.json
          set +e
          python experimental_g331/tools/c4_stage_gate.py --request autonomous_pretrain --contract experimental_g331/governance/constitution_contract.json
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo 'ERROR: autonomous pretraining gate bypassed or changed unexpectedly.'
            exit 1
          fi
          echo 'UNPROVEN_AUTONOMOUS_PRETRAINING_CORRECTLY_BLOCKED'
      - name: Package precisely tested C004 Android native runtime
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/c4-native
          zip -q -r "$GITHUB_WORKSPACE/C4_G331_C004_R3_NATIVE_RUNTIME.zip" c4child -i 'c4child/*.py'
          unzip -t "$GITHUB_WORKSPACE/C4_G331_C004_R3_NATIVE_RUNTIME.zip" | tail -1
          cmp c4child/structured_cognition.py "$GITHUB_WORKSPACE/experimental_g331/native_c4child/structured_cognition.py"
          cmp c4child/runtime.py "$GITHUB_WORKSPACE/experimental_g331/native_c4child/runtime.py"
      - uses: actions/upload-artifact@v4
        with:
          name: C4-G331-C004-R3-TESTED-RUNTIME
          path: C4_G331_C004_R3_NATIVE_RUNTIME.zip
          if-no-files-found: error
